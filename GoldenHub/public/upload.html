<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit Content — Golden HUB</title><link rel="stylesheet" href="/css/style.css"><script type="module" src="/js/upload.js"></script></head><body><div id="site-header"></div><main class="wrap page-wrap narrow"><div class="breadcrumb"><a href="/">Home</a> / Creator / Upload</div><span class="eyebrow">CREATOR STUDIO</span><h1>Submit your creation</h1><p class="muted">Lengkapi informasi karya. Semua kiriman akan diperiksa Owner sebelum tampil secara publik.</p><form id="upload-form" class="form-panel" enctype="multipart/form-data"><div class="form-grid"><label class="span-2">Nama karya *<input name="title" required minlength="3" maxlength="90" placeholder="Nama addon, map, atau karya"></label><label>Kategori *<select name="category" required><option value="Addon">Addon</option><option value="Map">Map</option><option value="Texture Pack">Texture Pack</option><option value="Skin">Skin</option><option value="Script">Script</option><option value="Mod">Mod</option><option value="Shader">Shader</option><option value="Other">Other</option></select></label><label>Versi Minecraft<input name="version" placeholder="1.21.x"></label><label class="span-2">Deskripsi lengkap *<textarea name="description" required minlength="30" rows="7" placeholder="Jelaskan fitur, isi karya, persyaratan, dan cara penggunaan..."></textarea></label><label>Thumbnail utama *<input name="thumbnail" type="file" accept="image/png,image/jpeg,image/webp" required><small>PNG/JPG/WebP, maksimal 5 MB.</small></label><label>File karya *<input name="package" type="file" accept=".mcaddon,.mcpack,.mcworld,.mcstructure,.mcfunction,.js,.zip" required><small>File Minecraft, maksimal 100 MB.</small></label><label class="span-2">Foto / video tambahan<input name="media" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm" multiple><small>Maksimal 8 file, masing-masing maksimal 100 MB.</small></label><label class="span-2">Fitur utama <textarea name="features" rows="4" placeholder="Satu fitur per baris"></textarea></label><label class="span-2">Changelog<textarea name="changelog" rows="3" placeholder="Apa yang berubah di versi ini?"></textarea></label></div><div class="form-actions"><button class="button gold">Send for Owner approval</button><a class="button outline" href="/dashboard.html">My dashboard</a></div><div id="upload-message" class="form-message" role="status"></div></form></main><div id="site-footer"></div></body></html>
