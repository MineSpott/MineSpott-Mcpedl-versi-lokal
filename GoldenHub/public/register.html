<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Registration — Golden HUB</title><link rel="stylesheet" href="/css/style.css"><script type="module" src="/js/auth.js"></script></head><body><div id="site-header"></div><main class="auth-shell"><form id="register-form" class="auth-card"><span class="eyebrow">JOIN THE COMMUNITY</span><h1>Create creator account</h1><p class="muted">Pendaftaran umum menunggu persetujuan Owner. Kode undangan aktifkan akun Creator langsung.</p><label>Username<input name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username"></label><label>Password<input name="password" type="password" required minlength="10" autocomplete="new-password"><small>Minimal 10 karakter.</small></label><label>Invite code <span class="muted">(optional)</span><input name="inviteCode" placeholder="GH-XXXXXXXXXX"></label><button class="button gold full">Submit registration</button><p class="auth-note">Sudah punya akun? <a href="/login.html">Login</a></p><div id="auth-message" class="form-message" role="status"></div></form></main><div id="site-footer"></div></body></html>
